name: Build Cemu Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd src/android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" -Dorg.gradle.workers.max=2

      - uses: actions/upload-artifact@v4
        with:
          name: Cemu-Android-APK
          path: src/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
